<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f17">
<title>Codex JDR</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#0b0f17; --bg2:#121826; --card:#161e2e; --line:#26324a; --txt:#e6ecf5; --mut:#8b98b0;
  --acc:#f2b33d; --acc2:#5cc8ff; --ok:#3ecf8e; --bad:#ff5d6c; --r:14px;
  --ab:#3ea84a; --pr:#f2c230; --di:#7b4fc9; --ch:#d23b3b; --bo:#6cc7ef; --se:#222; --fo:#f4f4f4;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(70px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:linear-gradient(180deg,#0b0f17 70%,#0b0f17cc);padding:12px 16px 8px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
header h1{font-size:16px;margin:0;letter-spacing:.08em;text-transform:uppercase;color:var(--acc);flex:1;white-space:nowrap}
header select{max-width:58%;background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:6px 8px;font:inherit;font-size:13px}
main{padding:14px 14px 20px;max-width:760px;margin:auto}
.view{display:none}.view.on{display:block}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#0d1320f2;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:9;backdrop-filter:blur(8px)}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:9px 0 10px;font:600 11px system-ui;letter-spacing:.04em;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--acc)}
h2{font-size:15px;text-transform:uppercase;letter-spacing:.1em;color:var(--acc);margin:22px 0 10px}
h2:first-child{margin-top:4px}
h3{font-size:14px;margin:14px 0 6px;color:var(--acc2)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.mut{color:var(--mut);font-size:13px}
button.b,.b{background:var(--bg2);color:var(--txt);border:1px solid var(--line);border-radius:11px;padding:9px 13px;font:600 14px system-ui;cursor:pointer}
button.b.acc{background:var(--acc);color:#1b1200;border-color:var(--acc)}
button.b.sm{padding:5px 9px;font-size:13px;border-radius:9px}
button.b.bad{color:var(--bad)}
button.b:disabled{opacity:.35}
input,select,textarea{background:var(--bg2);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:9px 10px;font:inherit;width:100%}
textarea{min-height:80px;resize:vertical}
label.f{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.06em}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;background:#26324a;color:var(--acc2)}
.pill.c{background:#3a2c0d;color:var(--acc)}
.list .it{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--card)}
.chars{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ch{background:var(--bg2);border:1px solid var(--line);border-radius:12px;text-align:center;padding:8px 4px}
.ch .v{font-size:26px;font-weight:800;color:var(--acc)}
.ch .n{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.ch .pm{display:flex;justify-content:center;gap:6px;margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--bg2);border:1px solid var(--line);border-radius:12px;text-align:center;padding:8px 2px}
.stat .v{font-size:20px;font-weight:800}
.stat .n{font-size:10px;text-transform:uppercase;color:var(--mut)}
.sk{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:center;padding:7px 0;border-bottom:1px solid #1d2638}
.sk:last-child{border:0}
.sk .nm{font-size:14px}
.sk .nm small{color:var(--mut)}
.sk .car{color:var(--acc)}
.pool{display:flex;gap:3px;flex-wrap:wrap;min-height:18px}
.pip{width:14px;height:14px;display:inline-block}
.xpbar{position:sticky;top:50px;z-index:4;background:#1a2336;border:1px solid var(--acc);border-radius:12px;padding:8px 12px;display:flex;justify-content:space-between;margin-bottom:12px;font-weight:700}
.xpbar .neg{color:var(--bad)}
.dice-pick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.dp{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center}
.dp .cnt{font-size:20px;font-weight:800}
.dp .nm{font-size:11px;color:var(--mut)}
.dp .pm{display:flex;justify-content:center;gap:6px;margin-top:4px}
.res{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0}
.die{width:52px;height:52px;display:flex;align-items:center;justify-content:center;border-radius:10px;font-weight:800;font-size:13px;position:relative;animation:roll .5s ease-out}
@keyframes roll{0%{transform:rotate(-200deg) scale(.3);opacity:0}100%{transform:none;opacity:1}}
.sum{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;font-size:16px;font-weight:700}
.sum .big{font-size:22px}
.verdict{text-align:center;font-size:20px;font-weight:800;margin:8px 0}
.ok{color:var(--ok)}.ko{color:var(--bad)}
.hit{padding:10px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--card)}
.hit .src{font-size:12px;color:var(--acc)}
.hit mark{background:#f2b33d55;color:inherit;border-radius:3px}
.page{white-space:pre-wrap;font-size:14px;line-height:1.5}
.tok{display:inline-flex;width:34px;height:34px;border-radius:50%;align-items:center;justify-content:center;font-weight:800;cursor:pointer;margin:3px;border:2px solid}
.tok.l{background:#eef5ff;color:#123;border-color:#9cf}
.tok.d{background:#1a0d12;color:#f77;border-color:#a33}
.ini .it{cursor:grab}
.ini .it.cur{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.trk{display:flex;align-items:center;gap:6px}
.trk .v{min-width:46px;text-align:center;font-weight:800;font-size:18px}
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow:auto}
.tabs button{white-space:nowrap}
.tabs button.on{background:var(--acc);color:#1b1200;border-color:var(--acc)}
.modal{position:fixed;inset:0;background:#000b;z-index:20;display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.modal .box{background:var(--bg2);border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:760px;max-height:88vh;overflow:auto;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--acc);color:#1b1200;padding:8px 14px;border-radius:99px;font-weight:700;z-index:30;opacity:0;transition:.3s;pointer-events:none}
.toast.on{opacity:1}
details summary{cursor:pointer;font-weight:700;padding:6px 0}
.tree{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px 12px}
.tc{position:relative;border:1.5px solid var(--line);border-radius:10px;padding:6px 5px;min-height:60px;font-size:11.5px;line-height:1.25;background:var(--bg2);cursor:pointer;display:flex;flex-direction:column;justify-content:space-between}
.tc .nm{font-weight:700;overflow-wrap:anywhere;hyphens:auto}
.tc.act .nm{color:#ff9f9f}
.tc .cost{font-size:10px;color:var(--mut);margin-top:3px}
.tc.own{border-color:var(--acc);background:#3a2c0d}
.tc.own .nm{color:var(--acc)}
.tc.av{border-color:var(--acc2)}
.tc.lock{opacity:.5}
.tc .cr{position:absolute;right:-14px;top:50%;width:13px;height:3px;background:#56657f}
.tc .cd{position:absolute;bottom:-18px;left:50%;width:3px;height:17px;background:#56657f;margin-left:-1px}
.tc .on{background:var(--acc)}
.ref p{margin:6px 0}
.ref table{width:100%;border-collapse:collapse;font-size:13px}
.ref td,.ref th{border-bottom:1px solid var(--line);padding:5px;text-align:left}
#print{display:none}
@media print{
  body{background:#fff;color:#000;padding:0;font-size:11pt}
  body>*:not(#print){display:none!important}
  #print{display:block;color:#000}
  #print h1{font-size:20pt;margin:0 0 4px;color:#000} #print h2{font-size:13pt;margin:12px 0 4px;border-bottom:1px solid #000;color:#000;letter-spacing:0;text-transform:none}
  #print table{border-collapse:collapse;width:100%;margin:6px 0} #print td,#print th{border:1px solid #999;padding:3px 5px;text-align:left;vertical-align:top}
  #print .pc td{text-align:center} #print .sk2{columns:2} #print .sm{font-size:9pt;color:#444}
}
</style>
</head>
<body>
<header>
  <h1>Codex JDR</h1>
  <select id="sysSel" aria-label="Système de jeu"></select>
</header>

<main>
  <!-- ============ PERSOS ============ -->
  <section class="view on" id="v-persos"></section>
  <!-- ============ DÉS ============ -->
  <section class="view" id="v-des"></section>
  <!-- ============ MJ ============ -->
  <section class="view" id="v-mj"></section>
  <!-- ============ RÈGLES ============ -->
  <section class="view" id="v-regles"></section>
</main>

<nav>
  <button data-v="persos" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4.5-6 8-6s7 2 8 6"/></svg>Persos</button>
  <button data-v="des"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l9 5v10l-9 5-9-5V7z"/><path d="M12 2v20M3 7l18 10M21 7L3 17"/></svg>Dés</button>
  <button data-v="mj"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M8 22h8M12 18v4"/></svg>MJ</button>
  <button data-v="regles"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h11a3 3 0 013 3v13H7a3 3 0 01-3-3z"/><path d="M4 17a3 3 0 013-3h11"/></svg>Règles</button>
</nav>

<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>
<div class="toast" id="toast"></div>

<script src="data-starwars.js"></script>
<script src="data-starwars-trees.js"></script>
<script src="data-starwars-extra.js"></script>
<script src="data-starwars-adv.js"></script>
<script src="data-starwars-veh.js"></script>
<script src="app.js"></script>
</body>
</html>
